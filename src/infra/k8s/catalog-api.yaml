apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-api
  template:
    metadata:
      labels:
        app: catalog-api
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: shop-app
      containers:
        - name: catalog-api
          image: shop-catalog-api
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: shop-config
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-api
  namespace: shop
spec:
  selector:
    app: catalog-api
  ports:
    - port: 8080
      targetPort: 8080
