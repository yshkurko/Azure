# Локальный стенд. Только для разработки: пароль и ключ Azurite — публично известные тестовые значения.
#   Вся система:          docker compose up -d --build   ->  http://localhost:8080
#   Только SQL + Azurite: docker compose up -d sqlserver azurite   (сервисы запускаете через dotnet run)
name: shop

x-azurite-connection: &azurite-connection "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;QueueEndpoint=http://azurite:10001/devstoreaccount1;"
x-sql-connection: &sql-connection "Server=sqlserver,1433;Database=shopdb;User Id=sa;Password=Local_Dev_Passw0rd!;TrustServerCertificate=True"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Local_Dev_Passw0rd!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Local_Dev_Passw0rd!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck --loose
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"

  catalog-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: Shop.Catalog.Api
    restart: on-failure
    environment:
      ConnectionStrings__ShopDb: *sql-connection
    ports:
      - "5101:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  orders-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: Shop.Orders.Api
    # Catalog и Orders одновременно создают БД при первом старте — проигравший перезапустится.
    restart: on-failure
    environment:
      ConnectionStrings__ShopDb: *sql-connection
      Services__CatalogApiUrl: "http://catalog-api:8080/"
      Messaging__StorageQueue__ConnectionString: *azurite-connection
    ports:
      - "5102:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      azurite:
        condition: service_started
      catalog-api:
        condition: service_started

  order-processor:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: Shop.OrderProcessor
    restart: on-failure
    environment:
      ConnectionStrings__ShopDb: *sql-connection
      Messaging__StorageQueue__ConnectionString: *azurite-connection
    ports:
      - "5103:8080"
    depends_on:
      orders-api:
        condition: service_started

  web:
    build:
      context: ./shop-web
    ports:
      - "8080:8080"
    depends_on:
      - catalog-api
      - orders-api

volumes:
  sqldata:
